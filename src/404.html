<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        // Store the URL that led to 404
        sessionStorage.redirect = location.href;
    </script>
    <meta http-equiv="refresh" content="0;URL='https://bharath-nagesh.github.io/'">
</head>
<body>
    <h1>Page Not Found</h1>
    <p>Redirecting to homepage...</p>
    <script>
        // If this is a direct hit on 404.html, redirect to the root
        if (location.pathname === '/404.html') {
            window.location.href = 'https://bharath-nagesh.github.io/';
        }
    </script>
</body>
</html>
