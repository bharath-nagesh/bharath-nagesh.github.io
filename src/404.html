<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        // Store the full path including query string
        sessionStorage.redirect = window.location.pathname + window.location.search;
        // Redirect to the home page immediately
        window.location.href = '/';
    </script>
</head>
<body>
    <h1>Page Not Found</h1>
    <p>Redirecting to homepage...</p>
</body>
</html>
