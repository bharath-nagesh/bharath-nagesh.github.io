<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>BN Favicon Generator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f0f0f0;
        }
        
        #favicon-container {
            position: relative;
            width: 512px;
            height: 512px;
            background: linear-gradient(135deg, #0077FF, #004499);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #bn-text {
            font-family: 'Arial', sans-serif;
            font-size: 200px;
            font-weight: bold;
            color: white;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div id="favicon-container">
        <div id="bn-text">BN</div>
    </div>
    
    <script>
        // Instructions for saving:
        // 1. Open this HTML file in a browser
        // 2. Right-click on the blue circle with "BN" and select "Save image as..."
        // 3. Save as "bn-favicon.png" in the images folder
        // 4. Use the saved image as your favicon
    </script>
</body>
</html>
