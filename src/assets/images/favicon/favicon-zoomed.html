<!DOCTYPE html>
<html>

<head>
    <title>Zoomed Favicon</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #121212;
        }

        .container {
            width: 64px;
            height: 64px;
            overflow: hidden;
            border-radius: 50%;
            position: relative;
        }

        .zoomed-image {
            position: absolute;
            width: 120px;
            /* Scale up the image */
            height: 120px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* Center the zoomed portion */
            object-fit: cover;
            object-position: center;
            /* Focus on the center where the letters are */
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="../favicon.jpeg" class="zoomed-image" alt="Zoomed Favicon">
    </div>
</body>

</html>
