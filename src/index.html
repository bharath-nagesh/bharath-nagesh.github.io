<!doctype html>
<html lang="en" style="scroll-behavior: smooth;">

<head>
    <meta charset="utf-8">
    <title>Bharath Nagesh - Full Stack Developer</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
        content="Bharath Nagesh - Full Stack Developer specializing in Angular, Node.js, and D3.js">

    <!-- SVG Favicon with BN letters -->
    <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%230077FF'/><text x='50' y='65' font-size='45' text-anchor='middle' fill='white' font-family='Arial, sans-serif' font-weight='bold'>BN</text></svg>">
    
    <!-- Fallback for browsers that don't support SVG -->
    <link rel="icon" type="image/jpeg" href="assets/images/favicon.jpeg#zoomed" sizes="any">
    <link rel="icon" type="image/jpeg" href="assets/images/favicon.jpeg#zoomed" sizes="32x32">
    <link rel="icon" type="image/jpeg" href="assets/images/favicon.jpeg#zoomed" sizes="48x48">
    <link rel="icon" type="image/jpeg" href="assets/images/favicon.jpeg#zoomed" sizes="96x96">
    <link rel="icon" type="image/jpeg" href="assets/images/favicon.jpeg#zoomed" sizes="144x144">

    <!-- Apple Touch Icon with zoom -->
    <link rel="apple-touch-icon" href="assets/images/favicon.jpeg#zoomed">
    <link rel="apple-touch-icon" sizes="152x152" href="assets/images/favicon.jpeg#zoomed">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon.jpeg#zoomed">
    <link rel="apple-touch-icon" sizes="192x192" href="assets/images/favicon.jpeg#zoomed">

    <!-- Microsoft Tile Icon -->
    <meta name="msapplication-TileImage" content="assets/images/favicon.jpeg#zoomed">
    <meta name="msapplication-TileColor" content="#0077FF">

    <!-- Open Graph / Social Media preview image -->
    <meta property="og:image" content="assets/images/favicon.jpeg#zoomed">
    <meta property="og:image:width" content="192">
    <meta property="og:image:height" content="192">

    <!-- Favicon Zoom CSS -->
    <style>
        @media screen {
            head link[rel=icon][type="image/jpeg"],
            head link[rel=apple-touch-icon] {
                object-fit: cover !important;
                object-position: 50% 40% !important;
                transform-origin: center !important;
                transform: scale(3) !important;
            }
        }
    </style>

    <!-- GitHub Pages SPA redirect script -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>

    <!-- Quicksand Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const links = document.querySelectorAll('a[href^="#"]');

            links.forEach(link => {
                link.addEventListener('click', function (e) {
                    e.preventDefault();

                    const targetId = this.getAttribute('href').substring(1);
                    const targetElement = document.getElementById(targetId);

                    if (targetElement) {
                        const headerHeight = 70;

                        const elementPosition = targetElement.getBoundingClientRect().top;
                        const offsetPosition = elementPosition + window.scrollY - headerHeight;

                        window.scrollTo({
                            top: offsetPosition,
                            behavior: 'smooth'
                        });
                    }
                });
            });
        });

        document.addEventListener('DOMContentLoaded', function () {
            const faviconLinks = document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]');

            faviconLinks.forEach(link => {
                const currentHref = link.getAttribute('href');
                if (currentHref && currentHref.includes('favicon.jpeg')) {
                    // Force refresh with a more zoomed version
                    link.setAttribute('href', currentHref.split('#')[0] + '#zoomed');
                    
                    // Create a style element to apply the zoom effect
                    const style = document.createElement('style');
                    style.textContent = `
                        @media screen {
                            link[href*="favicon.jpeg#zoomed"] {
                                object-fit: cover !important;
                                object-position: 50% 40% !important;
                                transform-origin: center !important;
                                transform: scale(2.5) !important;
                            }
                        }
                    `;
                    document.head.appendChild(style);
                }
            });
        });
    </script>
</head>

<body>
    <app-root></app-root>
</body>

</html>
